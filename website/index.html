<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background:
    radial-gradient(
        circle at 50% 0%,
        #344274 0%,
        #111827 46%,
        #060912 100%
    );
    
            color: white;
        }

        /* =====================================================
           MAIN CONTAINER
           ===================================================== */

        .container {
            width: 100%;
            max-width: 1120px;
            min-height: 100vh;
            margin: auto;
            padding: 38px 24px;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           ASSISTANT HEADER
           ===================================================== */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .assistant-orb {
            width: 98px;
            height: 98px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 48%;

            font-size: 46px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff 0%,
                    #c4b5fd 12%,
                    #8b5cf6 42%,
                    #312e81 100%
                );

            box-shadow:
    0 0 32px rgba(139, 92, 246, 0.54),
    0 0 80px rgba(59, 130, 246, 0.24);

            animation: orbFloat 6s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        h1 {
    margin: 2px 0 0;

    font-size: 33px;
    font-weight: 750;

    letter-spacing: -0.9px;

    text-shadow:
        0 2px 14px rgba(139, 92, 246, 0.15);
}

        .subtitle {
    margin-top: 9px;
    color: #b4bed0;
    font-size: 15px;
    letter-spacing: 0.3px;
}

        .status {
    display: inline-block;
    margin-top: 15px;
    padding: 6px 13px;
    border-radius: 24px;

    color: #5eea8a;
    background: rgba(74, 222, 128, 0.12);
    border: 1px solid rgba(74, 222, 128, 0.24);
    box-shadow: 0 4px 16px rgba(74, 222, 128, 0.08);

    font-size: 13.5px;
}
#assistantState {
    margin-top: 10px;
    color: #9aa7ba;
    font-size: 13.5px;
    letter-spacing: 0.3px;
}
.assistant-orb.listening {
    animation: orbListening 1s ease-in-out infinite;
}

.assistant-orb.thinking {
    animation: orbThinking 0.8s ease-in-out infinite;
}

.assistant-orb.speaking {
    animation: orbSpeaking 0.5s ease-in-out infinite;
}

@keyframes orbListening {
    0%, 100% {
        transform: scale(1);
        box-shadow:
            0 0 25px rgba(59, 130, 246, 0.5),
            0 0 65px rgba(59, 130, 246, 0.2);
    }

    50% {
        transform: scale(1.08);
        box-shadow:
            0 0 40px rgba(59, 130, 246, 0.8),
            0 0 90px rgba(59, 130, 246, 0.3);
    }
}

@keyframes orbThinking {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

@keyframes orbSpeaking {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

        /* =====================================================
           CHAT AREA
           ===================================================== */

        #chat {
    height: 40vh;
    min-height: 220px;
    max-height: 450px;

    border-radius: 24px;
    background: rgba(15, 23, 42, 0.30);

border: 1px solid rgba(148, 163, 184, 0.12);

    overflow-y: auto;

    padding: 30px 10px;

    margin-bottom: 18px;

    scrollbar-width: auto;
scrollbar-color: rgba(100, 116, 139, 0.50) transparent;
}

        /* =====================================================
           MESSAGES
           ===================================================== */
.message::before {
    margin-right: 8px;
}

.assistant::before {
    content: "🤖";
}

.user::before {
    content: "👤";
}
        .message {
            width: fit-content;

            max-width: min(80%, 720px);

            margin: 11px 0;

            padding: 16px 19px;

            border-radius: 26px;

            line-height: 1.66;

            white-space: pre-wrap;

            word-wrap: break-word;

            font-size: 15.8px;

            animation: messageIn 0.25s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
    margin-left: auto;

    background: linear-gradient(
        135deg,
        #4338ca,
        #5b5ff0
    );

    border: 1px solid rgba(129, 140, 248, 0.32);

    border-bottom-right-radius: 10px;
    letter-spacing: 0.05px;


    box-shadow:
        0 8px 26px rgba(79, 70, 229, 0.16);
}

        .assistant {
    margin-right: auto;
    background: rgba(30, 41, 59, 0.86);
    border: 1px solid rgba(148, 163, 184, 0.20);
    border-bottom-left-radius: 9px;
    letter-spacing: 0.05px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(10px);
}

        /* =====================================================
           INPUT AREA
           ===================================================== */

        .input-area {
    display: flex;
    align-items: center;
    gap: 11px;

    padding: 8px 9px;

    border-radius: 28px;

    background: rgba(30, 41, 59, 0.95);

    border: 1px solid rgba(148, 163, 184, 0.28);

    box-shadow:
        0 10px 32px rgba(0, 0, 0, 0.20);

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.input-area:focus-within {
    border-color: rgba(99, 102, 241, 0.75);

    box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.17),
        0 10px 32px rgba(0, 0, 0, 0.16);
}
#messageInput {
    flex: 1;

    min-width: 0;

    padding: 15px 17px;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    font-size: 16.1px;
}

#messageInput::placeholder {
    color: #929eb6;
}
.quick-actions {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 19px;
}
.quick-actions button {
    background: rgba(30, 41, 59, 0.75);
    color: #dce3ee;
    border: 1px solid rgba(148, 163, 184, 0.16);

    border-radius: 19px;

    padding: 10px 13px;

    font-size: 12.6px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.15s ease;
}

.quick-actions button:hover {
    background: rgba(79, 70, 229, 0.24);
    border-color: rgba(99, 102, 241, 0.30);
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(79, 70, 229, 0.08);
}
        /* =====================================================
           BUTTONS
           ===================================================== */

        button {
            border: none;

            border-radius: 14px;

            padding: 12px 16px;

            cursor: pointer;

            font-size: 14px;

            color: white;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                background 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }

        #sendButton {
    background: linear-gradient(
        135deg,
        #4f46e5,
        #6366f1
    );

    padding-left: 23px;
    padding-right: 23px;
    min-height: 47px;
    border-radius: 16px;
    font-size: 14.2px;
    box-shadow:
    0 5px 20px rgba(79, 70, 229, 0.20);
}

        #sendButton:hover {
            background: #7376f5;
        }

        /* =====================================================
           CONTROL BUTTONS
           ===================================================== */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 11px;

            margin-top: 16px;

            flex-wrap: wrap;
        }

        .buttons button {
    background: rgba(30, 41, 59, 0.78);
    color: #d1d9e6;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 15px;
    backdrop-filter: blur(11px);
    padding: 14px 17px;
    font-size: 14.2px;
}
.buttons button:hover {
    background: rgba(79, 70, 229, 0.25);
    border-color: rgba(99, 102, 241, 0.42);
    box-shadow: 0 6px 18px rgba(79, 70, 229, 0.08);
}

        #wakeButton {
            color: #c4b5fd;
        }

        #micButton {
            color: #86efac;
        }

        #stopButton {
            color: #fca5a5;
        }

        #clearButton {
            color: #cbd5e1;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .container {
                padding: 24px 12px;
            }

            .assistant-orb {
                width: 76px;
                height: 76px;

                font-size: 36px;
            }

            h1 {
                font-size: 25px;
            }

            #chat {
                min-height: 52vh;

                max-height: 58vh;

                padding: 18px 4px;
            }

            .message {
                max-width: 92%;

                font-size: 14.5px;
            }

            .input-area {
                padding: 6px;
            }

            #messageInput {
                font-size: 16px;
            }

            #sendButton {
                padding: 12px 16px;
            }

            .buttons button {
                padding: 10px 13px;
            }
        }
    </style>

</head>


<body>

<div class="container">

    <!-- =====================================================
         ASSISTANT HEADER
         ===================================================== -->

    <div class="header">

        <div class="assistant-orb">
            🤖
        </div>

        <h1>
            My AI Assistant
        </h1>

        <div class="subtitle">
            Your personal AI for your laptop and phone
        </div>

        <div class="status">
    ● Online
</div>

<div id="assistantState">
    Ready to help
</div>

    </div>


    <!-- =====================================================
         CHAT
         ===================================================== -->

    <div id="chat"></div>
<div class="quick-actions">

    <button onclick="quickCommand('How is my laptop?')">
        💻 Laptop status
    </button>

    <button onclick="quickCommand('What is my phone status?')">
        📱 Phone status
    </button>

    <button onclick="quickCommand('Show my memory')">
        🧠 My memory
    </button>

    <button onclick="quickCommand('What can you do?')">
        ✨ What can you do?
    </button>

</div>


    <!-- =====================================================
         MESSAGE INPUT
         ===================================================== -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Ask me anything..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


    <!-- =====================================================
         VOICE CONTROLS
         ===================================================== -->

    <div class="buttons">

        <button
            id="wakeButton"
            onclick="startWakeWord()"
        >
            🔔 Wake Word
        </button>

        <button
            id="micButton"
            onclick="startListening()"
        >
            🎤 Mic
        </button>

        <button
            id="stopButton"
            onclick="stopListening(); stopSpeaking()"
        >
            ⏹ Stop
        </button>

        <button
            id="clearButton"
            onclick="clearChat()"
        >
            🗑 Clear
        </button>

    </div>

</div>


<script>

// ========================================================
// BACKEND URL
// ========================================================

let BACKEND_URL;

if (
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1"
) {

    BACKEND_URL =
        "http://127.0.0.1:8000";

} else {

    BACKEND_URL =
        "http://192.168.29.86:8000";
}



// ========================================================
// ELEMENTS
// ========================================================

const chat =
    document.getElementById("chat");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");
const assistantState =
    document.getElementById("assistantState");

const assistantOrb =
    document.querySelector(".assistant-orb");


function setAssistantState(state) {

    assistantOrb.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    if (state === "listening") {

        assistantState.textContent =
            "Listening...";

        assistantOrb.classList.add(
            "listening"
        );

    } else if (state === "thinking") {

        assistantState.textContent =
            "Thinking...";

        assistantOrb.classList.add(
            "thinking"
        );

    } else if (state === "speaking") {

        assistantState.textContent =
            "Speaking...";

        assistantOrb.classList.add(
            "speaking"
        );

    } else {

        assistantState.textContent =
            "Ready to help";
    }
}



// ========================================================
// VOICE VARIABLES
// ========================================================

let recognition = null;

let wakeRecognition = null;

let isListening = false;

let shouldKeepListening = false;



// ========================================================
// ADD MESSAGE
// ========================================================

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}

function quickCommand(command) {

    messageInput.value = command;

    sendMessage();
}



// ========================================================
// SPEAK
// ========================================================

function speak(text) {
setAssistantState("speaking");

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.rate = 1;

    speech.pitch = 1;

    speech.volume = 1;

    speech.onend = function() {
setAssistantState("ready");

        if (
            shouldKeepListening &&
            !isListening &&
            recognition
        ) {

            setTimeout(function() {

                try {

                    recognition.start();

                } catch (error) {

                    console.log(
                        "Listening after speech:",
                        error
                    );
                }

            }, 500);
        }
    };

    window.speechSynthesis.speak(
        speech
    );
}



// ========================================================
// STOP SPEAKING
// ========================================================

function stopSpeaking() {

    if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

    }
}



// ========================================================
// SEND MESSAGE
// ========================================================

async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        message,
        "user"
    );

    messageInput.value = "";

    sendButton.disabled = true;

    try {

        const response =
            await fetch(
                BACKEND_URL + "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        command: message
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Backend returned HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            data &&
            typeof data.response === "string" &&
            data.response.trim() !== ""
        ) {

            addMessage(
                data.response,
                "assistant"
            );

            speak(
                data.response
            );

        } else {

            addMessage(
                "I did not receive a response.",
                "assistant"
            );
        }

    } catch (error) {

        console.error(
            "Backend error:",
            error
        );

        addMessage(
            "I could not connect to the AI server.",
            "assistant"
        );
    }


    sendButton.disabled = false;

    messageInput.focus();


    // Restart listening after command

    if (
        shouldKeepListening &&
        recognition
    ) {

        setTimeout(function() {

            try {

                recognition.start();

            } catch (error) {

                console.log(
                    "Listening restart:",
                    error
                );
            }

        }, 1000);
    }
}



// ========================================================
// ENTER KEY
// ========================================================

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }
    }
);



// ========================================================
// CLEAR CHAT
// ========================================================

function clearChat() {

    chat.innerHTML = "";

    stopSpeaking();
}



// ========================================================
// START WAKE WORD
// ========================================================

function startWakeWord() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        addMessage(
            "Voice recognition is not supported in this browser.",
            "assistant"
        );

        return;
    }


    document.getElementById(
        "wakeButton"
    ).textContent =
        "🔴 Wake Word Active";


    addMessage(
        'Wake word mode started. Say "Hey Assistant".',
        "assistant"
    );


    if (wakeRecognition) {

        try {

            wakeRecognition.stop();

        } catch (error) {
        }
    }


    wakeRecognition =
        new SpeechRecognition();


    wakeRecognition.lang =
        "en-US";

    wakeRecognition.continuous =
        true;

    wakeRecognition.interimResults =
        false;


    wakeRecognition.onresult =
        function(event) {

            const text =
                event.results[
                    event.results.length - 1
                ][0]
                .transcript
                .toLowerCase()
                .trim();


            console.log(
                "Wake word heard:",
                text
            );


            if (
                text.includes("hey assistant") ||
                text.includes("hey ai assistant")
            ) {

                try {

                    wakeRecognition.stop();

                } catch (error) {
                }


                startListening();
            }
        };


    wakeRecognition.onerror =
        function(event) {

            console.log(
                "Wake word error:",
                event.error
            );
        };


    wakeRecognition.onend =
        function() {

            console.log(
                "Wake word listener stopped."
            );
        };


    try {

        wakeRecognition.start();

    } catch (error) {

        console.log(
            "Could not start wake word:",
            error
        );
    }
}



// ========================================================
// START NORMAL LISTENING
// ========================================================

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        addMessage(
            "Voice recognition is not supported in this browser.",
            "assistant"
        );

        return;
    }


    shouldKeepListening = true;


    if (recognition) {

        try {

            recognition.stop();

        } catch (error) {
        }
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
    function() {

        isListening = true;

        setAssistantState("listening");

            document.getElementById(
                "micButton"
            ).textContent =
                "🎙 Listening...";
        };


    recognition.onresult =
        function(event) {
        setAssistantState("thinking");

            const text =
                event.results[0][0]
                    .transcript
                    .trim();


            if (!text) {
                return;
            }


            messageInput.value =
                text;

            sendMessage();
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );


            if (
                event.error !== "aborted" &&
                event.error !== "no-speech"
            ) {

                addMessage(
                    "Voice recognition error: " +
                    event.error,
                    "assistant"
                );
            }
        };


    recognition.onend =
        function() {

            isListening = false;


            document.getElementById(
                "micButton"
            ).textContent =
                "🎤 Mic";


            if (shouldKeepListening) {

                setTimeout(
                    function() {

                        if (
                            !isListening &&
                            shouldKeepListening
                        ) {

                            try {

                                recognition.start();

                            } catch (error) {

                                console.log(
                                    "Waiting to restart listening..."
                                );
                            }
                        }

                    },
                    1500
                );
            }
        };


    try {

        recognition.start();

    } catch (error) {

        console.error(
            "Could not start speech recognition:",
            error
        );
    }
}



// ========================================================
// STOP LISTENING
// ========================================================

function stopListening() {

    shouldKeepListening = false;


    if (recognition) {

        try {

            recognition.stop();

        } catch (error) {
        }
    }


    if (wakeRecognition) {

        try {

            wakeRecognition.stop();

        } catch (error) {
        }

        wakeRecognition = null;
    }


    document.getElementById(
        "wakeButton"
    ).textContent =
        "🔔 Wake Word";


    document.getElementById(
        "micButton"
    ).textContent =
        "🎤 Mic";


    isListening = false;
setAssistantState("ready");
    console.log(
        "All voice listening stopped."
    );
}



// ========================================================
// WELCOME MESSAGE
// ========================================================

addMessage(
    "Hello! I am your AI Assistant. How can I help you?",
    "assistant"
);

</script>

</body>
</html>
